name: CI

on:
  push:
    branches: [main, main-ts7, ts7-release, 'release-*']
  pull_request:
    branches: [main, main-ts7, ts7-release, 'release-*']
  merge_group:
    branches: [main, main-ts7, ts7-release, 'release-*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: npx hereby build
      - run: npx hereby build:api
      - run: npm run -w vscode-typescript build

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: npx hereby test
      - if: runner.os == 'Linux'
        run: npx hereby test:benchmarks
      - if: runner.os == 'Linux'
        run: npx hereby test:tools
      - if: runner.os == 'Linux'
        run: npx hereby test:api

  coverage:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TSGO_HEREBY_COVERAGE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: npx hereby test
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          disable_search: true
          directory: ./coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: npx hereby lint

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: npx hereby generate
      - run: npx hereby generate:enums
      - run: npx hereby generate:ast
      - run: npx hereby generate:vendor
      - run: node --experimental-strip-types ./tsc/internal/lsp/lsproto/_generate/fetchModel.mts
      - run: node --experimental-strip-types ./tsc/internal/lsp/lsproto/_generate/generate.mts
      - run: npx hereby generate:extension
      - run: npx hereby check:scripts
      - run: git diff --exit-code

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: npx hereby check:format

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: go -C ./tsc mod tidy -diff
      - run: go -C ./tools mod tidy -diff
      - run: go work sync
      - run: git diff --exit-code

  required:
    if: always()
    needs: [build, test, coverage, lint, generate, format, tidy]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.build.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.coverage.result }}" = success
          test "${{ needs.lint.result }}" = success
          test "${{ needs.generate.result }}" = success
          test "${{ needs.format.result }}" = success
          test "${{ needs.tidy.result }}" = success
